# Publish the documentation site to GitHub Pages.
#
# Separate from `ci.yml` because it deploys: CI runs on every pull request and must not
# touch anything outside the runner, while this runs on `main` alone and has write access
# to the Pages environment.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer commit supersedes an older deployment, but a deployment already running is
# allowed to finish rather than being cancelled half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: install zola
        run: |
          set -euo pipefail
          VERSION=0.23.4
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${VERSION}/zola-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
      - name: build
        # The base URL decides every canonical link, the sitemap and the Open Graph URLs,
        # so it comes from the Pages configuration rather than from a value committed here
        # that would be wrong on a fork.
        run: zola --root site build --base-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
